name = "tg-copy-bot"
main = "worker.js"
compatibility_date = "2026-01-01"
keep_vars = true

# check every minute whether recent source posts were deleted (free plan)
[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "ALBUMS"
class_name = "AlbumBuffer"

[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

# new_sqlite_classes = free-plan compatible Durable Objects
[[migrations]]
tag = "v1"
new_sqlite_classes = ["AlbumBuffer"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Store"]
